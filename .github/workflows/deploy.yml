name: Build-Deploy-Server

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baihu

jobs:
  build:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        base_type: [debian]
        include:
          - base_type: debian
            base_tag: base
            tag_suffix: ""

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest-${{ matrix.arch }}${{ matrix.tag_suffix }},enable={{is_default_branch}}
            type=ref,event=branch,suffix=-${{ matrix.arch }}${{ matrix.tag_suffix }}
            type=sha,prefix={{branch}}-,suffix=-${{ matrix.arch }}${{ matrix.tag_suffix }}

      - name: Get build time
        id: build_time
        run: echo "time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.build_time.outputs.time }}
            BASE_TAG=${{ matrix.base_tag }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}-${{ matrix.base_type }}
          cache-to: type=gha,scope=linux-${{ matrix.arch }}-${{ matrix.base_type }},mode=max
          provenance: false

      - name: Trigger Watchtower CD Update
        if: github.ref == 'refs/heads/main' && matrix.base_type == 'debian' && matrix.arch == 'amd64'
        continue-on-error: true
        env:
          DEPLOY_CMD: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "ℹ️ 未配置 WATCHTOWER_WEBHOOK_URL，跳过更新"
            exit 0
          fi
          echo "🚀 触发 Watchtower 容器自动更新..."
          eval "$DEPLOY_CMD"