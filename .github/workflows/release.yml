name: Release-and-Build-Docker-Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baihu

jobs:
  build-artifacts:
    if: github.event.repository.fork == false
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Generate Swagger
        run: make swag

      - name: Build Binaries and Agents
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x build/build-go.sh
          # 1. 产出供 Docker 极速装配的双架构二进制与全平台 Agent
          ./build/build-go.sh ci-artifacts dist-assets
          # 2. 产出供 GitHub Release 发布的内嵌 web 归档包与 Windows 编译物
          ./build/build-go.sh release-artifacts .

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            bin/baihu.exe
            bin/baihu-tray.exe
          retention-days: 1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            baihu-linux-amd64.tar.gz
            baihu-linux-arm64.tar.gz
            baihu-linux-armv7.tar.gz
            baihu-android-arm64.tar.gz
            baihu-windows-amd64.zip
            data/agent/baihu-agent-*.tar.gz
            data/agent/baihu-agent-*.zip
          retention-days: 1

      - name: Upload Docker Build Context
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            web/dist
            dist-assets
          retention-days: 1

  build-installer:
    if: github.event.repository.fork == false
    runs-on: windows-latest
    needs: build-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows GUI Installer (Inno Setup)
        run: iscc /DMyAppVersion=${{ github.ref_name }} build/windows/installer.iss

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: bin/BaihuPanel-Setup-*.exe
          retention-days: 1

  publish-release:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    needs: [build-artifacts, build-installer]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .

      - name: Download Setup Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-setup-exe
          path: bin

      - name: Prepare Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "$(cat CHANGELOG.md)" > FINAL_CHANGELOG.md
            echo -e "\n\n" >> FINAL_CHANGELOG.md
            gh release view ${{ github.ref_name }} --json body -q .body >> FINAL_CHANGELOG.md
          else
            cp CHANGELOG.md FINAL_CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: FINAL_CHANGELOG.md
          files: |
            baihu-linux-amd64.tar.gz
            baihu-linux-arm64.tar.gz
            baihu-linux-armv7.tar.gz
            baihu-android-arm64.tar.gz
            baihu-windows-amd64.zip
            bin/BaihuPanel-Setup-*.exe
            data/agent/baihu-agent-*.tar.gz
            data/agent/baihu-agent-*.zip

  build:
    if: github.event.repository.fork == false
    needs: build-artifacts
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        base_type: [debian, debian13, minimal]
        include:
          - base_type: debian
            base_tag: base
            tag_suffix: ""
            dockerfile: ./docker/Dockerfile
          - base_type: debian13
            base_tag: base-debian13
            tag_suffix: "-debian13"
            dockerfile: ./docker/Dockerfile
          - base_type: minimal
            base_tag: base-minimal
            tag_suffix: "-minimal"
            dockerfile: ./docker/Dockerfile.minimal

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker Build Context
        uses: actions/download-artifact@v4
        with:
          name: docker-artifacts

      - name: Prepare build context
        run: |
          cp dist-assets/bin/linux-${{ matrix.arch }}/baihu ./baihu
          chmod +x ./baihu
          mkdir -p data/agent
          cp -r dist-assets/agent/* data/agent/
          rm -rf dist-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ci
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_TAG=${{ matrix.base_tag }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-${{ matrix.arch }}-${{ matrix.base_type }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04-arm
    needs: [build, build-artifacts]
    strategy:
      matrix:
        base_type: [debian, debian13, minimal]
        include:
          - base_type: debian
            tag_suffix: ""
          - base_type: debian13
            tag_suffix: "-debian13"
          - base_type: minimal
            tag_suffix: "-minimal"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-linux-*-${{ matrix.base_type }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.tag_suffix }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
